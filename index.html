'Save as goal',checkIt:'Check',logSpend:'Log spending',category:'Category',planned:'Planned',unplanned:'Impulse',recent:'Recent',none:'Nothing yet',brainTitle:'What PAVOS has learned',accuracy:'Buy/wait accuracy',calls:'calls judged',weights:'Signal weights',ma:'Moving average',supportW:'Support/resistance',trend:'Trend',fibW:'Fibonacci',bias:'Buy pickiness',lessons:'Lessons',brainHelp:'Log prices after you buy or wait. PAVOS checks if its call was right and adjusts itself.',bought:'Bought',reset:'Reset all data',resetConfirm:'Tap again to erase everything',privateNote:'Your data stays on this device.',vitalTitle:'Monthly vital bills',vitalSub:'Must-pay costs. PAVOS takes these out first and never treats them as adjustable.',b_rent:'Rent / mortgage',b_loans:'Loans (car, student, credit card)',b_food:'Food / groceries',b_transport:'Transportation / gas',b_subs:'Subscriptions (phone, internet, streaming)',b_family:'Family support',b_invest:'Investments / retirement',b_other:'Other bills',totalVital:'Total vital bills',resetBills:'Reset',billsReset:'Bills reset to $0',incomeReset:'Income reset to $0',saveBills:'Save bills',saved:'Saved \u2713',vitalKind:'Vital bill',billsOnHome:'Vital bills (edit in Bills)',recentChecks:'Recent checks',edit:'Edit',saveChanges:'Save changes',checkAgain:'Check again',markBought:'Mark as bought',markNotBought:'Mark as not bought',tapToEdit:'Tap a check to edit it.',checkedOnly:'checked',thisMonth:'This month',spentSoFar:'Spent so far (outside vital bills)',leftMonth:'Left this month',usedPct:'{p} of your income is used',calendar:'Spending calendar',dayLetters:'S M T W T F S',weekCol:'Week',monthTotal:'Month total',weekAvg:'Weekly average',noSpendDay:'No spending this day',calNote:'Shows purchases you marked "I bought this". Vital bills are not included. Tap a day to see or delete its purchases.',autoSaved:'Saved automatically.',tourHello:'Quick tour',tourStep:'Step {a} of {b}',tourStart:'Start the tour (2 min)',tourSkip:'Skip, I will explore',tourSkipRest:'Skip the rest',tourFinish:'Start using PAVOS',tourAgain:'Start over',showTour:'Show the quick tour again',howToUse:'How to use this screen',gotIt:'Got it',tour_welcome_t:'Hi {n}, I am your PAVOS guide',tour_welcome_s:'A two-minute walkthrough of how PAVOS turns your numbers into clear buying decisions.',tour_welcome_b:'\u2022 What you will see|How each screen works, how purchases are scored and how PAVOS learns your habits.\n\u2022 Private by design|Everything stays encrypted on this device. No accounts and no tracking.\n\u2022 At your pace|Skip anytime and replay it later from Settings.',tour_home_t:'Home \xb7 Your month at a glance',tour_home_s:'A live picture of where your money stands this month.',tour_home_b:'\u2022 Monthly budget|Your take-home income. Vital bills are pulled in from Bills automatically.\n\u2022 This month|Income minus vital bills minus what you have spent so far equals what is left to use.\n\u2022 Monthly Health Score|Rates the whole month from \u22121 to +1, based on how extra purchases affect your budget and goals.\n\u2022 Spending calendar|Daily and weekly totals. Tap a day to review or remove a purchase.',tour_check_t:'Check \xb7 Decide before you buy',tour_check_s:'Run any purchase through PAVOS in seconds.',tour_check_b:'\u2022 Describe it|Enter the item, its price and whether it is a Need, a Want or an Emergency.\n\u2022 Get a verdict|PAVOS answers Buy it, Save first, Hold or Skip, with the reasons in plain language.\n\u2022 See the trade-off|Opportunity cost shows what the same money could become: part of a home, index funds, Bitcoin or Treasury bonds.\n\u2022 Close the loop|Tap "I bought this" when you buy. Real purchases are what PAVOS learns from.',tour_scores_t:'Scores \xb7 How PAVOS decides',tour_scores_s:'Every verdict comes from the same clear scale.',tour_scores_b:'\u2022 Budget Health Score|From \u22121 to +1. At +0.30 or higher a purchase is healthy, at \u22120.35 or lower it is unhealthy, and in between it calls for caution.\n\u2022 Ready money|How much of the price your available money covers today, after bills and goals.\n\u2022 Monthly Health Score|The same scale applied to your entire month.\n\u2022 Learns with you|The healthy line adjusts as PAVOS sees which purchases actually strained your budget.\n\u2022 Need details?|Tap \u24d8 on any card for a full explanation.',tour_goals_t:'Goals \xb7 Save with a plan',tour_goals_s:'Turn the things you want into a timeline you can keep.',tour_goals_b:'\u2022 Set a target|Add a price and, if you like, a deadline.\n\u2022 Track progress|Add money as you save. The ring and icon fill as you get closer, and at 100% your guide takes off in a victory flight.\n\u2022 Realistic pacing|Without a deadline, PAVOS suggests a monthly amount that fits your budget and estimates how long it will take.',tour_bills_t:'Bills \xb7 Your fixed commitments',tour_bills_s:'The costs that come first, every month.',tour_bills_b:'\u2022 Vital bills|Rent, loans, food, transportation, subscriptions, family support and investments.\n\u2022 Protected first|PAVOS subtracts them before anything else and never treats them as optional.\n\u2022 Quick reset|Clear all bills at once, with Undo if you change your mind.',tour_brain_t:'Brain \xb7 It learns how you spend',tour_brain_s:'Personal insight that improves with every month of use.',tour_brain_b:'\u2022 Six areas|Budget, spending habits, timing, prices, judgment and goals. Each region fills as PAVOS learns that part of your finances.\n\u2022 Built from your data|Your purchases, checks and feedback. Never other people\'s data.\n\u2022 Teach it faster|Answer "Did this hurt my budget?" when PAVOS asks.\n\u2022 Personal advice|At 75% understanding it unlocks tailored "Where to cut" advice. Full understanding takes about six months.',tour_settings_t:'Settings \xb7 Make it yours',tour_settings_s:'Preferences, backups and your profile.',tour_settings_b:'\u2022 Backup and restore|Export a backup code regularly. It is the only way to move or recover your data.\n\u2022 Display|Text size, language, and the Original or Cream White theme (the half-and-half circle at the top).\n\u2022 Reminders|Optional reminders in the Android app.\n\u2022 Profile|Replay this tour, or delete your profile at the bottom of the page.',tour_security_t:'Security \xb7 Your data stays yours',tour_security_s:'Protection is built in, not added on.',tour_security_b:'\u2022 Encrypted storage|Everything PAVOS saves is encrypted with AES-256 on this device.\n\u2022 App lock|A 4-digit PIN with 3 recovery questions in case you forget it.\n\u2022 Privacy screen|In the phone app, PAVOS is hidden in recent apps and screenshots are blocked.\n\u2022 No tracking|No accounts, ads or analytics. The Privacy Policy is always in Settings.',tour_done_t:'You are ready to go',tour_done_s:'Three moves to get the most from PAVOS:',tour_done_b:'1. Add your bills|Enter your vital bills and take-home income.\n2. Set a goal|Pick something you are saving for.\n3. Check your next purchase|Run it through Check before you buy.\n\u2022 Help is always close|Tap \u24d8 at the top of any screen.',help_home_t:'Home',help_home:'Enter your take-home income in Monthly budget. It saves automatically.\nThis month shows what is left after vital bills and your purchases.\nThe Monthly Health Score rates your month from \u22121 to +1. Tap its \u24d8 for details.\nIn the calendar, tap a day to see or delete its purchases.',help_goals_t:'Goals',help_goals:'Tap "+ New goal", add a name, price, optional date, priority and Need/Want.\nOpen a goal to add money, log a new price or mark it bought.\nTap the big icon to choose a different one.\nTurn animations on or off at the top of the list.',help_check_t:'Check',help_check:'Type the item and price, pick Need, Want or Emergency, then tap Check.\nRead the PAVOS answer first, then the details below it.\nTap "I bought this" if you buy it, or "Save as goal" to save up for it.\nIn Recent checks, tap a check to edit it, or tap \u2715 to delete it.',help_spend_t:'Bills',help_spend:'Enter every must-pay monthly cost and tap Save bills.\nThese come out of your income first and are never counted as extra spending.\nReset clears all bills at once. You can undo it for a few seconds.',help_brain_t:'Brain',help_brain:'The brain shows how well PAVOS understands your habits. Each color is one area.\n"Teach me next" tells you the best way to help it learn.\nAnswer "Did this hurt my budget?" after purchases.\n"Where to cut" unlocks at 75% with savings ideas from your own data.',help_settings_t:'Settings',help_settings:'Export a backup regularly and keep the code somewhere safe.\nSet a PIN to lock the app on this device. You will also answer 3 recovery questions in case you forget it.\nChange the text size, turn reminders on (Android app), or replay the tour.\nDeleting your profile erases everything on this device.',wCreate:'Create your profile',wCreateSub:'Pick a nickname. PAVOS shows it in binary and keeps all your data (budget, bills, goals, checks and the Brain) under this profile, only on this device.',wCreateKeep:'Pick a nickname. Your existing PAVOS data will be kept under this profile.',wCreateBtn:'Create profile',wGuest:'Continue as guest',wGuestSub:'Try PAVOS without saving anything',guestBanner:'Guest mode: nothing is saved.',guestBrain:'Guest',profile:'Profile',exitGuest:'Exit guest mode',guestNote:'You are using PAVOS as a guest. Your data disappears when you exit or close the app. Create a profile to keep it.',memberSince:'Profile since {d}',resetBrain:'Reset the Brain',resetBrainSub:'The Brain forgets everything it learned, plus your checks, purchases and saving history, and starts from zero. Your profile, income, bills and goals stay.',resetBrainConfirm:'Tap again to reset the Brain',settings:'Settings',textSize:'Text size',sizeNormal:'Normal',sizeLarge:'Large',sizeXL:'Extra large',appLock:'App lock',appLockSub:'Ask for a 4-digit PIN when PAVOS opens. This keeps others f , purchases, spending, settings and what the Brain learns. It is saved only on this device (in the app, or in this browser for the website) and it is encrypted.'],['What PAVOS does not do','No accounts. No servers that store your data. No ads. No analytics or tracking. Your data is never sold.'],['Internet use','To show market prices, PAVOS downloads public prices (the Bitcoin price from Coinbase and the PAVOS market feed on GitHub). These requests contain no personal or financial information. Like any web request, those services and the website host can see your IP address.'],['Backups','A backup is made only when you choose. The backup code contains your data in readable form, so keep it private and only share it with yourself.'],['Your control','You can edit or delete anything at any time. "Delete profile" erases all data and destroys the encryption key. Uninstalling the app or clearing this site\'s data also removes it.'],['Security','Data is encrypted with AES-256. You can add a PIN lock. In the phone app, screenshots and screen recordings are blocked. No method is 100% secure: someone using your unlocked device may be able to open the app.'],['Children','PAVOS is not intended for children under 13.'],['Changes','If this policy changes, this page and its date will be updated.'],['Contact','Questions? Contact the PAVOS developer.']],legal_disclaimer:[['Education only','PAVOS is an educational budgeting tool. It is not financial, investment, tax or legal advice.'],['Estimates','Scores, odds, plans and tips are estimates based on the numbers you enter and simple models. They can be wrong.'],['Market prices','Prices may be delayed or out of date. Home, stock, Bitcoin and bond examples show opportunity cost only. They are not recommendations to buy any investment. Past returns do not guarantee future results.'],['Your decisions','You are responsible for your choices. For important money decisions, talk to a licensed professional.'],['Demo version','This demo is provided "as is", without any warranty.']]},es:{tagline:'Compra inteligente. Ahorra para lo que quieres.',home:'Inicio',goals:'Metas',check:'Revisar',spend:'Gastos',brain:'Cerebro',budget:'Presupuesto mensual',income:'Ingreso (neto)',bills:'Gastos fijos',spendingCap:'Plan de gasto flexible (ajustable)',savePct:'% de dinero libre para ahorrar',investRate:'% de retorno de inversi\xf3n / a\xf1o',save:'Guardar',freeCash:'Dinero libre / mes',monthlySave:'Ahorro para metas / mes',learnedSpend:'Gasto real aprendido',impulse:'Gasto impulsivo',totalSaved:'Ahorrado en metas',activeGoals:'Metas activas',newGoal:'Nueva meta',name:'Nombre',target:'Precio objetivo',alreadySaved:'Ya ahorrado',deadline:'Fecha l\xedmite (AAAA-MM-DD, opcional)',priority:'Prioridad',high:'Alta',med:'Media',low:'Baja',add:'Agregar',cancel:'Cancelar',del:'Borrar',back:'Atr\xe1s',addMoney:'Agregar',amount:'Monto',logPrice:'Registrar un precio visto',price:'Precio',odds:'Probabilidad de cumplir la fecha',eta:'Tiempo estimado',weeks:'semanas',months:'meses',perWeek:'/ semana',weekly:'Ahorro por semana',neededWeekly:'Necesario por semana',signal:'Se\xf1al de precio',buyNow:'COMPRA YA \u2014 buen precio',okPrice:'PRECIO JUSTO \u2014 se puede comprar',waitPrice:'ESPERA \u2014 el precio puede bajar',needPrices:'Registra al menos 2 precios para ver la se\xf1al',confidence:'Confianza',score:'Puntaje',support:'Soporte (bajo)',resistance:'Resistencia (alto)',average:'Promedio',dropOdds:'Probabilidad de baja en las pr\xf3ximas 4 revisiones',fib:'Niveles Fibonacci',iBought:'Lo compr\xe9',iWait:'Voy a esperar',afford:'Capacidad de compra',green:'Lo puedes pagar ya',yellow:'A\xfan no est\xe1 ahorrado',red:'Compra grande \u2014 plan\xe9ala',smr:'Dinero listo (S = M/R)',load:'Meses de dinero libre',toAfford:'Tiempo para pagarlo',oppCost:'Costo de oportunidad (si lo invirtieras)',years:'a\xf1os',quickCheck:'Revisi\xf3n r\xe1pida de compra',itemPrice:'Precio del art\xedculo',pastPrices:'Precios anteriores (opcional, separados tra compras marcadas con "Lo compr\xe9". No incluye gastos vitales. Toca un d\xeda para ver o borrar sus compras.',autoSaved:'Se guarda autom\xe1ticamente.',tourHello:'Recorrido r\xe1pido',tourStep:'Paso {a} de {b}',tourStart:'Empezar el recorrido (2 min)',tourSkip:'Omitir, prefiero explorar',tourSkipRest:'Omitir el resto',tourFinish:'Empezar a usar PAVOS',tourAgain:'Volver al inicio',showTour:'Ver el recorrido otra vez',howToUse:'C\xf3mo usar esta pantalla',gotIt:'Entendido',tour_welcome_t:'Hola {n}, soy tu gu\xeda de PAVOS',tour_welcome_s:'Un recorrido de dos minutos sobre c\xf3mo PAVOS convierte tus n\xfameros en decisiones de compra claras.',tour_welcome_b:'\u2022 Qu\xe9 ver\xe1s|C\xf3mo funciona cada pantalla, c\xf3mo se califican las compras y c\xf3mo PAVOS aprende tus h\xe1bitos.\n\u2022 Privado por dise\xf1o|Todo queda cifrado en este dispositivo. Sin cuentas y sin rastreo.\n\u2022 A tu ritmo|Om\xedtelo cuando quieras y rep\xedtelo despu\xe9s desde Ajustes.',tour_home_t:'Inicio \xb7 Tu mes de un vistazo',tour_home_s:'Una imagen en vivo de c\xf3mo est\xe1 tu dinero este mes.',tour_home_b:'\u2022 Presupuesto mensual|Tu ingreso neto. Los gastos vitales se toman de Gastos autom\xe1ticamente.\n\u2022 Este mes|Ingreso menos gastos vitales menos lo gastado hasta hoy es lo que te queda.\n\u2022 Puntaje de Salud del Mes|Califica todo el mes de \u22121 a +1 seg\xfan c\xf3mo tus compras extra afectan tu presupuesto y metas.\n\u2022 Calendario de gastos|Totales diarios y semanales. Toca un d\xeda para revisar o quitar una compra.',tour_check_t:'Revisar \xb7 Decide antes de comprar',tour_check_s:'Pasa cualquier compra por PAVOS en segundos.',tour_check_b:'\u2022 Descr\xedbela|Escribe el art\xedculo, su precio y si es Necesidad, Deseo o Emergencia.\n\u2022 Recibe un veredicto|PAVOS responde C\xf3mpralo, Ahorra primero, Espera o No lo compres, con las razones en palabras simples.\n\u2022 Mira lo que cambias|El costo de oportunidad muestra en qu\xe9 podr\xeda convertirse ese dinero: parte de una casa, fondos indexados, Bitcoin o bonos del Tesoro.\n\u2022 Cierra el ciclo|Toca "Lo compr\xe9" cuando compres. PAVOS aprende de tus compras reales.',tour_scores_t:'Puntajes \xb7 C\xf3mo decide PAVOS',tour_scores_s:'Cada veredicto sale de la misma escala clara.',tour_scores_b:'\u2022 Puntaje de Salud|De \u22121 a +1. Desde +0.30 la compra es saludable, desde \u22120.35 hacia abajo no es saludable, y en medio pide cuidado.\n\u2022 Dinero listo|Cu\xe1nto del precio cubre hoy tu dinero disponible, despu\xe9s de gastos y metas.\n\u2022 Puntaje de Salud del Mes|La misma escala aplicada a todo tu mes.\n\u2022 Aprende contigo|La l\xednea saludable se ajusta seg\xfan qu\xe9 compras realmente apretaron tu presupuesto.\n\u2022 \xbfM\xe1s detalles?|Toca \u24d8 en cualquier tarjeta para una explicaci\xf3n completa.',tour_goals_t:'Metas \xb7 Ahorra con un plan',tour_goals_s:'Convierte lo que quieres en un plan que puedas cumplir.',tour_goals_b:'\u2022 Define un objetivo|Agrega un precio y, si quieres, una fecha l\xedmite.\n\u2022 Sigue tu avance|Agrega dinero mientras ahorras. El anillo y el \xedcono se llenan, y al 100% tu gu\xeda despega en un vuelo de victoria.\n\u2022 Ritmo realista|Sin fecha, PAVOS sugiere un monto mensual que cabe en tu presupuesto y estima cu\xe1nto tardar\xe1s.',tour_bills_t:'Gastos \xb7 Tus compromisos fijos',tour_bills_s:'Los costos que van primero, cada mes.',tour_bills_b:'\u2022 Gastos vitales|Renta, pr\xe9stamos, comida, transporte, suscripciones, apoyo familiar e inversiones.\n\u2022 Protegidos primero|PAVOS los resta antes que todo y nunca los trata como opcionales.\n\u2022 Reinicio r\xe1pido|Borra todos los gastos a la vez, con Deshacer si cambias de idea.',tour_brain_t:'Cerebro \xb7 Aprende c\xf3mo gastas',tour_brain_s:'Conocimiento personal que mejora con cada mes de uso.',tour_brain_b:'\u2022 Seis \xe1reas|Presupuesto, h\xe1bitos, horarios, precios, criterio y metas. Cada regi\xf3n se llena a medida que PAVOS aprende esa parte de tus finanzas.\n\u2022 Hecho con tus datos|Tus compras, revisiones y respuestas. Nunca datos de otras personas.\n\u2022 Ens\xe9\xf1ale m\xe1s r\xe1pido|Responde "\xbfEsto afect\xf3 mi presupuesto?" cuando PAVOS pregunte.\n\u2022 Consejos personales|Al 75% de comprensi\xf3n activa consejos de "D\xf3nde recortar" hechos para ti. La comprensi\xf3n total toma unos seis meses.',tour_settings_t:'Ajustes \xb7 Hazlo tuyo',tour_settings_s:'Preferencias, copias de seguridad y tu perfil.',tour_settings_b:'\u2022 Copia y restauraci\xf3n|Exporta un c\xf3digo de copia seguido. Es la \xfanica forma de mover o recuperar tus datos.\n\u2022 Pantalla|Tama\xf1o de texto, idioma y el tema Original o Blanco crema (el c\xedrculo de dos mitades arriba).\n\u2022 Recordatorios|Recordatorios opcionales en la app de Android.\n\u2022 Perfil|Repite este recorrido o borra tu perfil al final de la p\xe1gina.',tour_security_t:'Seguridad \xb7 Tus datos son tuyos',tour_security_s:'La protecci\xf3n viene incluida, no agregada.',tour_security_b:'\u2022 Almacenamiento cifrado|Todo lo que PAVOS guarda se cifra con AES-256 en este dispositivo.\n\u2022 Bloqueo|Un PIN de 4 d\xedgitos con 3 preguntas de recuperaci\xf3n por si lo olvidas.\n\u2022 Pantalla de privacidad|En la app del tel\xe9fono, PAVOS se oculta en apps recientes y se bloquean las capturas.\n\u2022 Sin rastreo|Sin cuentas, anuncios ni anal\xedticas. La Pol\xedtica de privacidad siempre est\xe1 en Ajustes.',tour_done_t:'Todo listo para empezar',tour_done_s:'Tres pasos para sacarle el m\xe1ximo a PAVOS:',tour_done_b:'1. Agrega tus gastos|Ingresa tus gastos vitales y tu ingreso neto.\n2. Crea una meta|Elige algo para lo que est\xe9s ahorrando.\n3. Revisa tu pr\xf3xima compra|P\xe1sala por Revisar antes de comprar.\n\u2022 La ayuda siempre est\xe1 cerca|Toca \u24d8 arriba en cualquier pantalla.',help_home_t:'Inicio',help_home:'Ingresa tu ingreso neto en Presupuesto mensual. Se guarda solo.\nEste mes muestra lo que queda despu\xe9s de gastos vitales y compras.\nEl Puntaje de Salud del Mes califica tu mes de \u22121 a +1. Toca su \u24d8 para detalles.\nEn el calendario, toca un d\xeda para ver o borrar sus compras.',help_goals_t:'Metas',help_goals:'Toca "+ Nueva meta" y agrega nombre, precio, fecha opcional, prioridad y Necesidad/Deseo.\nAbre una meta para agregar dinero, registrar un precio nuevo o marcarla comprada.\nToca el \xedcono grande para elegir otro.\nActiva o desactiva las animaciones arriba de la lista.',help_check_t:'Revisar',help_check:'Escribe el art\xedculo y precio, elige Necesidad, Deseo o Emergencia, y toca Revisar.\nLee primero la respuesta de PAVOS y luego los detalles.\nToca "Lo compr\xe9" si lo compras, o "Guardar como meta" para ahorrar.\nEn Revisiones recientes, toca una para editarla o \u2715 para borrarla.',help_spend_t:'Gastos',help_spend:'Ingresa cada pago mensual obligatorio y toca Guardar gastos.\nSe restan primero de tu ingreso y nunca cuentan como gasto extra.\nReiniciar borra todos los gastos a la vez. Puedes deshacerlo por unos segundos.',help_brain_t:'Cerebro',help_brain:'El cerebro muestra qu\xe9 tan bien PAVOS entiende tus h\xe1bitos. Cada color es un \xe1rea.\n"Ens\xe9\xf1ame ahora" te dice la mejor forma de ayudarlo a aprender.\nResponde "\xbfEsto afect\xf3 mi presupuesto?" despu\xe9s de comprar.\n"D\xf3nde recortar" se activa al 75% con ideas de ahorro de tus propios datos.',help_settings_t:'Ajustes',help_settings:'Exporta una copia seguido y guarda el c\xf3digo en un lugar seguro.\nPon un PIN para bloquear la app en este dispositivo. Tambi\xe9n responder\xe1s 3 preguntas de recuperaci\xf3n por si lo olvidas.\nCambia el tama\xf1o de texto, activa recordatorios (app Android) o repite el recorrido.\nBorrar tu perfil elimina todo en este dispositivo.',wCreate:'Crea tu perfil',wCreateSub:'Elige un apodo. PAVOS lo muestra en binario y guarda todos tus datos (presupuesto, gastos, metas, revisiones y el cerebro) en este perfil, solo en este dispositivo.',wCreateKeep:'
